[project]
name="causal_testing_walkthrough"
requires-python=">=3.12"
dependencies = [
    "covasim==3.1.8",
    "jupyter>=1.1.1",
    "rise>=5.7.1",
    "nbstripout",
    "pre-commit",
    "pygraphviz",
    "holoviews",
    "black",
    "causal_testing_framework==15.0.0",
    "nbclassic"
]
dynamic=["version"]

[tool.black]
# https://github.com/psf/black
line-length = 150
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
